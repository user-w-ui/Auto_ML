job:
  name: "house-prices-demo"

data:
  path: "./house_prices_train.csv"
  target: "SalePrice"
  task_type: "regression"

execution:
  code_executor_backend: "docker-jupyter"   # or "local-jupyter"
  docker_jupyter_image: ""                 # optional

workflow:
  max_rounds: 20
  train_trials: 2
  preprocess_max_attempts: 3
  train_max_attempts: 6

rag:
  kb_dir: "kb"
  top_k: 4
  ollama_base_url: "http://localhost:11434"
  ollama_model: "nomic-embed-text"